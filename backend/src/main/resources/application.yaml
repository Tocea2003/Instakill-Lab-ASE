spring:
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:sqlite:./instakill.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  servlet:
    context-path: /
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger
management:
  endpoints:
    web:
      exposure:
        include: health,info
media:
  base-path: media
  processing:
    max-width: 300
    watermark: Instakill Demo
instakill:
  jwt:
    secret: change-me-change-me-change-me-change-me-change-me-secret-key-1234
    issuer: instakill
    ttl-minutes: 120
  # "Make It Funnier" (Lab 7): any OpenAI-compatible /v1/chat/completions endpoint, LM Studio by default.
  llm:
    url: ${LOCAL_LLM_URL:http://localhost:12345/v1/chat/completions}
    model: ${LOCAL_LLM_MODEL:google/gemma-3-270m}
    system-prompt: >-
      Always reply with the user's message, but rewritten in a more funny style.
      Reply with the rewritten message only: no introduction, no explanation, no quotes.
    temperature: 0.7
    max-tokens: 256
    connect-timeout: 2s
    read-timeout: ${LOCAL_LLM_TIMEOUT:60s}
logging:
  level:
    org.hibernate.SQL: warn

notification:
  ntfy:
    enabled: false
    base-url: https://ntfy.sh
    topic: instakill-demo
