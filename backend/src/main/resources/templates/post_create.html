<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout('Create Post', ~{::section})}">
    <section>
        <h1>Create a post</h1>
        <form th:action="@{/posts}" th:object="${postForm}" method="post" class="form">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label>Content
                <textarea th:field="*{content}" rows="4" maxlength="1000"></textarea>
            </label>
            <div class="funny-row">
                <button type="button" id="funny-btn" class="funny-btn">Make It Funnier</button>
                <button type="button" id="funny-undo" class="undo-btn" hidden>Undo</button>
            </div>
            <div class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            <label>Image URL
                <input type="text" th:field="*{imageUrl}" placeholder="https://..."/>
            </label>
            <div class="error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></div>
            <button type="submit">Publish</button>
        </form>
        <div id="funny-toast" class="toast" role="status" hidden></div>
        <script th:src="@{/js/funnyfy.js}" defer></script>
    </section>
</div>
</body>
</html>
