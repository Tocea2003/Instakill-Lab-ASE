spring:
  datasource:
    url: jdbc:sqlite:file:memdb1?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
  main:
    web-application-type: servlet
server:
  servlet:
    context-path: /

instakill:
  jwt:
    secret: test-secret-change-me-change-me-change-me-change-me-1234567890
    issuer: instakill-test
    ttl-minutes: 60
  llm:
    # Nothing listens on port 1: tests exercise the "LM Studio not running" path, never a real model.
    url: http://127.0.0.1:1/v1/chat/completions
    model: test-model
    system-prompt: Be funny.
    read-timeout: 2s
media:
  base-path: ${java.io.tmpdir}/instakill-test-media
